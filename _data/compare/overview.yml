# Commands for the overview tab. Tool columns come from tabs.yml.
# Cell: cmd (string or list), status (match, partial, none, na), note (optional, short), source (https URL).
tasks:
  - id: create-project
    task: Create a project
    keywords: init new scaffold template starter
    cells:
      flisk:
        cmd:
          - flisk project
          - flisk init
        note: Writes the master config. Add a template name to clone a starter.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/project.ts
      terraform:
        cmd: terraform init
        status: partial
        note: Prepares a directory that has .tf files. Writes no configuration.
        source: https://developer.hashicorp.com/terraform/cli/commands/init
      compose:
        cmd: docker init
        note: Docker Desktop command. Writes Dockerfile, compose.yaml and more.
        source: https://docs.docker.com/reference/cli/docker/init/
      tilt:
        status: none
        note: No init command. You write the Tiltfile by hand.
        source: https://docs.tilt.dev/cli/tilt.html
      skaffold:
        cmd: skaffold init
        note: Finds Dockerfiles and manifests, then writes skaffold.yaml.
        source: https://skaffold.dev/docs/init/
      garden:
        cmd: garden create project
        note: Writes a project config and a blank .gardenignore. You add actions by hand.
        source: https://docs.garden.io/reference/commands#garden-create-project
      pm2:
        cmd: pm2 ecosystem
        note: Writes a sample ecosystem.config.js for you to edit.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk init app --language typescript
        note: Creates a CDK app from a template, in the language you pick.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-init.html
  - id: add-service
    task: Add a service
    keywords: resource new service backend frontend worker agent api
    cells:
      flisk:
        cmd: flisk resource api --type backend
        note: Creates the service and its service.json. Also frontend, worker, mcp, agent.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/resource.ts
      terraform:
        status: none
        note: No scaffold command. You add a resource block to a .tf file.
        source: https://developer.hashicorp.com/terraform/language/block/resource
      compose:
        status: none
        note: No command for it. You add an entry under services in compose.yaml.
        source: https://docs.docker.com/reference/compose-file/services/
      tilt:
        status: none
        note: No command. Edit the Tiltfile by hand.
        source: https://docs.tilt.dev/api.html
      skaffold:
        status: none
        note: No command for it. You add an artifact and its manifests to skaffold.yaml.
        source: https://skaffold.dev/docs/references/yaml/
      garden:
        status: none
        note: No command. You add an action config to a garden.yml file.
        source: https://docs.garden.io/reference/commands
      pm2:
        status: none
        note: No scaffold command. You add an entry to apps in ecosystem.config.js.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        status: none
        note: No command. You add a stack or construct in your code.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd.html
  - id: import-compose
    task: Import an existing docker-compose.yml
    keywords: migrate adopt existing brownfield compose convert
    cells:
      flisk:
        cmd: flisk import ./my-app
        note: One bring-your-own service.json per Compose service. --dry-run previews.
        source: https://github.com/flisk-sh/flisk/blob/main/docs/cheat-sheet.md#flisk-import-dir
      terraform:
        status: none
        note: terraform import adopts cloud resources into state, not Compose files.
        source: https://developer.hashicorp.com/terraform/language/import
      compose:
        status: na
        note: Not needed. Compose runs the file as it is.
        source: https://docs.docker.com/reference/cli/docker/compose/
      tilt:
        cmd: docker_compose('docker-compose.yml')
        note: A Tiltfile line, not a CLI command.
        source: https://docs.tilt.dev/docker_compose.html
      skaffold:
        cmd: skaffold init --compose-file docker-compose.yml
        note: Needs a Kubernetes cluster to run the result.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        status: none
        note: No importer. The docs convert a Compose project by hand.
        source: https://docs.garden.io/reference/commands
      pm2:
        status: none
        note: No Compose import. PM2 reads ecosystem.config.js.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        status: none
        note: cdk import adopts existing AWS resources. It does not read Compose files.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd.html
  - id: start
    task: Start the stack with live reload
    keywords: up run dev watch hot reload start
    cells:
      flisk:
        cmd: flisk up
        note: Starts every service with Tilt watching. Add a stack name for one stack.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/up.ts
      terraform:
        cmd: terraform apply
        status: partial
        note: Changes real infrastructure. No file watching.
        source: https://developer.hashicorp.com/terraform/cli/commands/apply
      compose:
        cmd: docker compose up --watch
        note: Each watched service needs a develop.watch section.
        source: https://docs.docker.com/compose/how-tos/file-watch/
      tilt:
        cmd: tilt up
        note: Runs the services in the Tiltfile and updates them as you edit.
        source: https://docs.tilt.dev/cli/tilt_up.html
      skaffold:
        cmd: skaffold dev
        note: Builds, deploys to a Kubernetes cluster and redeploys when files change.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden deploy --sync
        note: Deploys with code sync on, for each Deploy that has sync configured.
        source: https://docs.garden.io/reference/commands#garden-deploy
      pm2:
        cmd: pm2 start ecosystem.config.js
        note: "Set watch: true on an app to restart on file changes."
        source: https://pm2.keymetrics.io/docs/usage/application-declaration/
      cdk:
        cmd: cdk watch
        note: Deploys to your AWS account on each change, not to local containers.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-watch.html
  - id: start-one
    task: Start one service and what it needs
    keywords: only single subset dependencies depends_on partial
    cells:
      flisk:
        cmd: flisk up --only orders-api
        note: Also starts dependsOn services and shared infrastructure.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/up.ts
      terraform:
        cmd: terraform apply -target=ADDRESS
        status: partial
        note: Applies one resource and its dependencies. Exceptional use only.
        source: https://developer.hashicorp.com/terraform/cli/commands/plan
      compose:
        cmd: docker compose up orders-api
        note: Also starts linked services, unless they are already running.
        source: https://docs.docker.com/reference/cli/docker/compose/up/
      tilt:
        cmd: tilt up orders-api
        note: A Tiltfile that uses config.parse changes this.
        source: https://docs.tilt.dev/cli/tilt_up.html
      skaffold:
        cmd: skaffold dev -m orders-api
        status: partial
        note: Filters to named modules, so it needs a multi-config skaffold.yaml.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden deploy api
        note: Deploys it and the actions it depends on, once.
        source: https://docs.garden.io/reference/commands#garden-deploy
      pm2:
        cmd: pm2 start ecosystem.config.js --only api
        status: partial
        note: Starts only the named app. The file has no dependency option.
        source: https://pm2.keymetrics.io/docs/usage/application-declaration/
      cdk:
        cmd: cdk watch api
        note: Also deploys the stacks it depends on. --exclusively skips them.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-watch.html
  - id: preview
    task: Preview without changing anything
    keywords: dry run plan what-if diff
    cells:
      flisk:
        cmd: flisk up --dry-run
        note: Shows what would start, without starting it.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/up.ts
      terraform:
        cmd: terraform plan
        note: Shows the changes apply would make to your infrastructure.
        source: https://developer.hashicorp.com/terraform/cli/commands/plan
      compose:
        cmd: docker compose --dry-run up
        note: A global flag. It works with most commands, but not with ps, ls or logs.
        source: https://docs.docker.com/reference/cli/docker/compose/
      tilt:
        status: none
        note: tilt up has no dry-run flag.
        source: https://docs.tilt.dev/cli/tilt_up.html
      skaffold:
        cmd: skaffold render
        status: partial
        note: Prints the manifests it would deploy. Needs a cluster unless --offline.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden plan
        note: Experimental. Shows what would run without changing anything.
        source: https://docs.garden.io/reference/commands#garden-plan
      pm2:
        status: none
        note: No dry-run or plan command.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk diff
        note: Compares your code with the deployed stacks.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-diff.html
  - id: restart
    task: Restart one service
    keywords: reload rebuild trigger recreate bounce
    cells:
      flisk:
        cmd: flisk restart api
        note: Triggers an update in the running stack. Calls tilt trigger.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/restart.ts
      terraform:
        cmd: terraform apply -replace=ADDRESS
        status: partial
        note: Replaces one resource, which recreates real infrastructure.
        source: https://developer.hashicorp.com/terraform/cli/commands/plan
      compose:
        cmd: docker compose restart api
        note: Ignores changes to compose.yaml and env vars. Run up again.
        source: https://docs.docker.com/reference/cli/docker/compose/restart/
      tilt:
        cmd: tilt trigger api
        note: Triggers an update for one resource.
        source: https://docs.tilt.dev/cli/tilt_trigger.html
      skaffold:
        status: none
        note: No per-service restart. skaffold dev redeploys when files change.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden deploy api --force
        status: partial
        note: No restart command. --force redeploys even if the Deploy is up to date.
        source: https://docs.garden.io/reference/commands#garden-deploy
      pm2:
        cmd: pm2 restart api
        note: Kills then restarts the process. pm2 reload is for cluster mode.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        status: none
        note: No restart command. cdk watch redeploys when files change.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd.html
  - id: stop
    task: Stop and tear down
    keywords: down destroy delete clean remove stop
    cells:
      flisk:
        cmd: flisk down
        note: Stops all Tilt resources. --dry-run shows what would stop.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/down.ts
      terraform:
        cmd: terraform destroy
        note: Destroys the real infrastructure Terraform created, not a local dev stack.
        source: https://developer.hashicorp.com/terraform/cli/commands/destroy
      compose:
        cmd: docker compose down
        note: Removes containers and project networks. -v also removes named volumes.
        source: https://docs.docker.com/reference/cli/docker/compose/down/
      tilt:
        cmd: tilt down
        note: Deletes what tilt up created. Keeps volumes unless you add --delete-volumes.
        source: https://docs.tilt.dev/cli/tilt_down.html
      skaffold:
        cmd: skaffold delete
        note: Deletes what Skaffold deployed. skaffold dev also cleans up when you stop it.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden cleanup deploy
        note: Un-deploys every Deploy. garden cleanup namespace clears the whole namespace.
        source: https://docs.garden.io/reference/commands#garden-cleanup-deploy
      pm2:
        cmd: pm2 delete all
        note: Stops every app and removes it from the list. pm2 stop all keeps them listed.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk destroy --all
        note: Deletes the stacks from your AWS account, not a local dev stack.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-destroy.html
  - id: status
    task: Check status
    keywords: ps health running list state healthy
    cells:
      flisk:
        cmd: flisk status
        note: --unhealthy lists failing or starting services. --json is for scripts.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/status.ts
      terraform:
        cmd: terraform state list
        status: partial
        note: Lists the resources in state. It does not check whether they are healthy.
        source: https://developer.hashicorp.com/terraform/cli/commands/state/list
      compose:
        cmd: docker compose ps
        note: Lists the project's containers and their state.
        source: https://docs.docker.com/reference/cli/docker/compose/ps/
      tilt:
        cmd: tilt get uiresources
        note: Lists the resources of a running Tilt. The Tilt web UI shows the same.
        source: https://docs.tilt.dev/resource_dependencies.html
      skaffold:
        status: none
        note: No status command. Use kubectl to see what is running in the cluster.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden get status
        note: Shows the status of the environment and every action.
        source: https://docs.garden.io/reference/commands#garden-get-status
      pm2:
        cmd: pm2 list
        note: Lists every process with its status, CPU and memory.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk list
        status: partial
        note: Lists the app's stacks. It does not show what is deployed or healthy.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-list.html
  - id: logs
    task: Read logs
    keywords: output tail follow stderr stdout errors
    cells:
      flisk:
        cmd: flisk logs -s api --since 5m
        note: A bounded snapshot of recent lines. --unhealthy reads only failing services.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/logs.ts
      terraform:
        status: none
        note: Terraform does not run your services. TF_LOG turns on Terraform's own debug log.
        source: https://developer.hashicorp.com/terraform/internals/debugging
      compose:
        cmd: docker compose logs -f api
        note: Follows one service's output.
        source: https://docs.docker.com/reference/cli/docker/compose/logs/
      tilt:
        cmd: tilt logs -f api
        note: Follows one resource's logs. Add --since to limit by time.
        source: https://docs.tilt.dev/cli/tilt_logs.html
      skaffold:
        cmd: skaffold run --tail
        status: partial
        note: No logs command. skaffold dev streams logs by default, and run does with --tail.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden logs api
        note: Add --follow to stream new lines.
        source: https://docs.garden.io/reference/commands#garden-logs
      pm2:
        cmd: pm2 logs api
        note: Streams the app's logs. --nostream prints them without streaming.
        source: https://pm2.keymetrics.io/docs/usage/log-management/
      cdk:
        cmd: cdk watch
        status: partial
        note: No logs command. cdk watch streams CloudWatch log events by default.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-watch.html
  - id: urls
    task: Find service URLs
    keywords: ports networks links endpoints open browser address
    cells:
      flisk:
        cmd: flisk networks
        note: Lists the Traefik-routed URL of every service. Add --raw to print URLs only.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/networks.ts
      terraform:
        cmd: terraform output
        status: partial
        note: Prints output values from state, such as an endpoint you declared.
        source: https://developer.hashicorp.com/terraform/cli/commands/output
      compose:
        cmd: docker compose port web 80
        note: Prints the host port mapped to one service port.
        source: https://docs.docker.com/reference/cli/docker/compose/port/
      tilt:
        status: none
        note: No CLI command. Links show in the Tilt web UI.
        source: https://docs.tilt.dev/cli/tilt.html
      skaffold:
        cmd: skaffold dev --port-forward
        status: partial
        note: Forwards service ports from the cluster as part of the dev loop.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden get status --output yaml
        status: partial
        note: The output lists each service's ingress endpoints and forwardable ports.
        source: https://docs.garden.io/reference/commands#garden-get-status
      pm2:
        status: none
        note: PM2 tracks processes, not URLs or ports.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk deploy --outputs-file outputs.json
        status: partial
        note: Deploys, then writes stack outputs, such as an endpoint you declared, to a file.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-deploy.html
  - id: doctor
    task: Diagnose the machine
    keywords: doctor check environment install readiness troubleshoot setup
    cells:
      flisk:
        cmd: flisk doctor
        note: Checks Docker, Tilt, disk space, networks. --fix repairs unused networks.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/doctor.ts
      terraform:
        status: none
        note: No environment check. terraform version prints versions only.
        source: https://developer.hashicorp.com/terraform/cli/commands
      compose:
        cmd: docker info
        status: partial
        note: Prints system-wide information. It is not a readiness check.
        source: https://docs.docker.com/reference/cli/docker/system/info/
      tilt:
        cmd: tilt doctor
        note: Prints diagnostics for bug reports.
        status: partial
        source: https://docs.tilt.dev/cli/tilt_doctor.html
      skaffold:
        status: none
        note: No machine check. skaffold diagnose looks at the project config instead.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden get debug-info
        status: partial
        note: Writes a zip of debug info. Not a readiness check.
        source: https://docs.garden.io/reference/commands#garden-get-debug-info
      pm2:
        cmd: pm2 report
        status: partial
        note: Prints a diagnostic report for bug reports. It is not a readiness check.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk doctor
        status: partial
        note: Prints project and environment info. Not a readiness check.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-doctor.html
  - id: verify-config
    task: Check generated config
    keywords: validate drift lint config verify
    cells:
      flisk:
        cmd: flisk config verify
        note: Checks generated files match .flisk/project.json. regenerate fixes drift.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/config.ts
      terraform:
        cmd: terraform validate
        note: Checks .tf syntax and consistency. Does not contact remote state or providers.
        source: https://developer.hashicorp.com/terraform/cli/commands/validate
      compose:
        cmd: docker compose config -q
        note: Validates compose.yaml. Drop -q to print the resolved model.
        source: https://docs.docker.com/reference/cli/docker/compose/config/
      tilt:
        cmd: tilt alpha tiltfile-result
        status: partial
        note: An alpha command. Runs the Tiltfile and prints the result as JSON.
        source: https://docs.tilt.dev/cli/tilt_alpha_tiltfile-result.html
      skaffold:
        cmd: skaffold diagnose --yaml-only
        note: Prints the effective skaffold.yaml.
        status: partial
        source: https://skaffold.dev/docs/references/cli/
      garden:
        cmd: garden validate
        note: Checks your config files and exits with code 1 on errors.
        source: https://docs.garden.io/reference/commands#garden-validate
      pm2:
        status: none
        note: No command checks ecosystem.config.js.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: cdk synth --quiet
        note: Runs your app and validates the generated templates. --quiet hides the output.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-synth.html
  - id: connect-agent
    task: Connect an AI coding agent (MCP)
    keywords: ai agent mcp claude cursor codex llm assistant
    cells:
      flisk:
        cmd: flisk connect claude
        note: Writes the MCP entry and Flisk skills. Also cursor and codex.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/connect.ts
      terraform:
        cmd: claude mcp add terraform -s user -t stdio -- docker run -i --rm hashicorp/terraform-mcp-server
        status: partial
        note: "HashiCorp's MCP server: registry docs and HCP Terraform, not a local stack."
        source: https://github.com/hashicorp/terraform-mcp-server
      compose:
        cmd: docker mcp client connect vscode --profile my-project
        status: partial
        note: Docker Desktop 4.62+. Connects to MCP Toolkit servers, not your Compose project.
        source: https://docs.docker.com/ai/mcp-catalog-and-toolkit/cli/
      tilt:
        status: none
        note: No official MCP server from the Tilt project.
        source: https://docs.tilt.dev/cli/tilt.html
      skaffold:
        status: none
        note: No official MCP server from the Skaffold project.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        status: none
        note: No MCP command in the CLI reference.
        source: https://docs.garden.io/reference/commands
      pm2:
        status: none
        note: No MCP command in the CLI reference.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        cmd: claude mcp add aws-iac uvx awslabs.aws-iac-mcp-server@latest
        status: partial
        note: AWS Labs server for CDK docs and CloudFormation checks, not your stack.
        source: https://github.com/awslabs/mcp
  - id: prune-networks
    task: Remove leftover Docker networks
    keywords: prune network cleanup address pool leftovers
    cells:
      flisk:
        cmd:
          - flisk down --prune-networks
          - flisk doctor --fix --scope machine
        note: First removes this project's unused networks. Second also clears other Flisk projects'.
        source: https://github.com/flisk-sh/flisk/blob/main/cli/src/commands/doctor.ts
      terraform:
        status: none
        note: Terraform manages what is in its state, not leftovers on your machine.
        source: https://developer.hashicorp.com/terraform/cli/commands
      compose:
        cmd: docker network prune
        note: Removes every unused network on the machine. compose down removes the project's own.
        source: https://docs.docker.com/reference/cli/docker/network/prune/
      tilt:
        status: none
        note: No network cleanup command.
        source: https://docs.tilt.dev/cli/tilt.html
      skaffold:
        status: none
        note: Skaffold runs on Kubernetes, so there are no Docker networks to clean up.
        source: https://skaffold.dev/docs/references/cli/
      garden:
        status: none
        note: No network cleanup command.
        source: https://docs.garden.io/reference/commands
      pm2:
        status: none
        note: No network cleanup command.
        source: https://pm2.keymetrics.io/docs/usage/commands/
      cdk:
        status: none
        note: CDK deploys to AWS, so there are no local Docker networks to clean up.
        source: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd.html
