<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Command Comparer: Flisk next to the usual tools"><title>Command Comparer</title>
  <!-- Source of assets/og.png. Render: rsvg-convert -w 1200 -h 630 assets/og.svg -o assets/og.png -->
  <defs>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.7"><stop offset="0" stop-color="#0b3a52"/><stop offset="1" stop-color="#0a0a0e"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.25" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0e" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0e" stop-opacity="0.95"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- logo: flisk-emoji apps/command-comparer.svg -->
  <svg x="64" y="64" width="56" height="56" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0ea5e9"/><rect x="12" y="14" width="16" height="36" rx="4" fill="#fbfaf7"/><rect x="36" y="24" width="16" height="26" rx="4" fill="#fbfaf7" fill-opacity=".62"/></svg>
  <text x="140" y="99" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3.6" fill="#38bdf8">COMMAND COMPARER / FIELD GUIDE</text>

  <g font-family="Inter, 'Helvetica Neue', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">
    <text x="64" y="262">Flisk next to</text>
    <text x="64" y="330">the usual tools.</text>
  </g>
  <text x="64" y="388" font-family="Inter, 'Helvetica Neue', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#9a9aa6">Every command has a source link.</text>
  <text x="64" y="420" font-family="Inter, 'Helvetica Neue', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#9a9aa6">Terraform, CDK, Compose, Tilt and more.</text>
  <g font-family="Inter, 'Helvetica Neue', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f3f5" text-anchor="middle">
    <rect x="64" y="460" width="110" height="44" rx="22" fill="#15161d" stroke="#2c2f3a"/><text x="119" y="489">16 tabs</text>
    <rect x="186" y="460" width="160" height="44" rx="22" fill="#15161d" stroke="#2c2f3a"/><text x="266" y="489">Source links</text>
    <rect x="358" y="460" width="150" height="44" rx="22" fill="#15161d" stroke="#2c2f3a"/><text x="433" y="489">Open source</text>
  </g>
  <rect x="64" y="538" width="500" height="2" fill="url(#rule)"/>
  <text x="64" y="590" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="28" fill="#e9ecef">cmd.flisk.si</text>

  <!-- right panel: the Overview tab of cmd.flisk.si -->
  <g transform="translate(632 56)">
    <rect width="640" height="620" rx="18" fill="#0f0f15" stroke="#2a2d38"/>
    <circle cx="28" cy="28" r="6" fill="#3a3d48"/><circle cx="48" cy="28" r="6" fill="#3a3d48"/><circle cx="68" cy="28" r="6" fill="#3a3d48"/>
    <text x="96" y="34" font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#868e96">cmd.flisk.si, Overview</text>
    <rect x="0" y="56" width="640" height="1" fill="#2a2d38"/>

    <g font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif" font-size="14">
      <rect x="20" y="74" width="84" height="28" rx="14" fill="#22c55e"/><text x="62" y="93" text-anchor="middle" fill="#04120a" font-weight="700">Overview</text>
      <text x="122" y="93" fill="#c4c4cc">Infra as code</text>
      <text x="230" y="93" fill="#c4c4cc">Compose &amp; Tilt</text>
      <text x="350" y="93" fill="#c4c4cc">Process runners</text>
      <text x="476" y="93" fill="#c4c4cc">Kubernetes dev</text>
      <text x="594" y="93" fill="#c4c4cc">Local</text>
    </g>
    <text x="20" y="140" font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ececf1">Flisk next to the usual tools</text>
    <g font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04120a" text-anchor="middle">
      <rect x="20" y="156" width="58" height="28" rx="14" fill="#22c55e"/><text x="49" y="175">Flisk</text>
      <rect x="86" y="156" width="104" height="28" rx="14" fill="#22c55e"/><text x="138" y="175">Terraform &#215;</text>
      <rect x="198" y="156" width="96" height="28" rx="14" fill="#22c55e"/><text x="246" y="175">AWS CDK &#215;</text>
      <rect x="302" y="156" width="164" height="28" rx="14" fill="#22c55e"/><text x="384" y="175">Docker Compose &#215;</text>
      <rect x="474" y="156" width="66" height="28" rx="14" fill="#22c55e"/><text x="507" y="175">Tilt &#215;</text>
      <rect x="548" y="156" width="110" height="28" rx="14" fill="none" stroke="#3a3d48"/><text x="603" y="175" fill="#c4c4cc">+ Add tool</text>
    </g>

    <!-- table -->
    <g transform="translate(20 204)">
      <rect width="640" height="430" fill="#121218" stroke="#2a2d38"/>
      <!-- Flisk column -->
      <rect x="165" y="0" width="190" height="430" fill="#0f2418"/>
      <rect x="165" y="0" width="190" height="62" fill="#22c55e"/>
      <rect x="165" y="0" width="1" height="430" fill="#22c55e"/><rect x="354" y="0" width="1" height="430" fill="#22c55e"/>
      <g font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif">
        <text x="12" y="26" font-size="15" font-weight="700" fill="#ececf1">Task</text>
        <text x="177" y="26" font-size="16" font-weight="700" fill="#04120a">Flisk</text>
        <text x="177" y="46" font-size="12" fill="#0b3a1c">Local dev stack</text>
        <text x="368" y="26" font-size="16" font-weight="700" fill="#ececf1">Terraform</text>
        <text x="368" y="46" font-size="12" fill="#8a8a94">Provisions infrastructure</text>
        <text x="540" y="26" font-size="16" font-weight="700" fill="#ececf1">AWS CDK</text>
        <text x="540" y="46" font-size="12" fill="#8a8a94">AWS infrastructure</text>
      </g>
      <g fill="#2a2d38">
        <rect x="0" y="62" width="640" height="1"/><rect x="0" y="134" width="640" height="1"/><rect x="0" y="196" width="640" height="1"/>
        <rect x="0" y="258" width="640" height="1"/><rect x="0" y="320" width="640" height="1"/><rect x="0" y="382" width="640" height="1"/>
        <rect x="528" y="0" width="1" height="430"/>
      </g>
      <g font-family="'Helvetica Neue', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ececf1">
        <text x="12" y="88">Create a project</text>
        <text x="12" y="160">Add a service</text>
        <text x="12" y="222">Import an existing</text><text x="12" y="240">docker-compose.yml</text>
        <text x="12" y="284">Start the stack with</text><text x="12" y="302">live reload</text>
        <text x="12" y="346">Start one service</text><text x="12" y="364">and what it needs</text>
        <text x="12" y="408">Preview without</text><text x="12" y="426">changing anything</text>
      </g>
      <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13">
        <g fill="#e6f7ec">
          <text x="177" y="88">flisk project</text><text x="177" y="108">flisk init</text>
          <text x="177" y="160">flisk resource api</text><text x="177" y="178">--type backend</text>
          <text x="177" y="222">flisk import ./my-app</text>
          <text x="177" y="284">flisk up</text>
          <text x="177" y="346">flisk up --only</text><text x="177" y="364">orders-api</text>
          <text x="177" y="408">flisk up --dry-run</text>
        </g>
        <g fill="#fbbf24">
          <text x="368" y="88">terraform init</text>
          <text x="368" y="284">terraform apply</text>
          <text x="368" y="346">terraform apply</text><text x="368" y="364">-target=ADDRESS</text>
        </g>
        <g fill="#d4d4dc">
          <text x="368" y="408">terraform plan</text>
          <text x="540" y="88">cdk init app</text><text x="540" y="106">--language</text><text x="540" y="124">typescript</text>
          <text x="540" y="284">cdk watch</text>
          <text x="540" y="346">cdk watch api</text>
          <text x="540" y="408">cdk diff</text>
        </g>
      </g>
    </g>
  </g>
  <rect x="624" y="540" width="600" height="90" fill="url(#fade)"/>
</svg>
