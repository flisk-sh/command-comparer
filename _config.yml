# Site settings. Jekyll does not reload this file during `jekyll serve`,
# so restart the server after editing it.
title: Command Comparer
# The homepage <title>, og:title and twitter:title: "<title>: <what it does>". Inner pages use "<page> | <title>".
home_title: "Command Comparer: Flisk commands next to Terraform, Compose, Tilt and more"
tagline: Flisk next to the tools people use for the same jobs
description: >-
  Side-by-side commands for Flisk, Terraform, AWS CDK, Docker Compose, Tilt, Skaffold, Garden,
  PM2 and more, across 16 tabs, with a source link for every cell.
lang: en

# Custom domain cmd.flisk.si (DNS on Cloudflare, CNAME to flisk-sh.github.io), served from the root.
# The old project URL, https://flisk-sh.github.io/command-comparer/, redirects here.
url: "https://cmd.flisk.si"
baseurl: ""

# Flisk Analytics: the domain this site is registered under at analytics.flisk.si. Remove the line to turn it off.
analytics_domain: "cmd.flisk.si"
repo_url: "https://github.com/flisk-sh/command-comparer"

markdown: kramdown


# Jekyll skips dot-folders; publish /.well-known/security.txt.
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - scripts/
  - docs/
  - vendor/
  - node_modules/
